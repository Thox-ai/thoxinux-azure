name: Verify deployment and kernel

# Documentation and metadata commits receive the same gate as code commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Do not interrupt a main-branch run while it is issuing a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_artifact_id: ${{ steps.release_bundle.outputs.artifact-id }}
      publish_release: ${{ steps.release_request.outputs.publish_release }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether this push issues a version
        id: release_request
        env:
          THOX_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 tools/create_release.py requested >> "$GITHUB_OUTPUT"

      - name: Check unit guards and generated deployment files
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 build_cloud_init.py --check
          python3 portal/build_portal.py --check

      - name: Install local emulator packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf util-linux

      - name: Boot real released kernel and verify lifecycle
        id: kernel
        run: python3 tools/verify_kernel.py --output "$RUNNER_TEMP/thoxinux-kernel-proof"

      - name: Preserve actual local kernel evidence
        if: ${{ always() && steps.kernel.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoxinux-kernel-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thoxinux-kernel-proof/
          retention-days: 30
          if-no-files-found: error

      - name: Package verified source and current CI evidence
        run: >-
          python3 tools/create_release.py prepare
          --proof-dir "$RUNNER_TEMP/thoxinux-kernel-proof"
          --output-dir "$RUNNER_TEMP/thoxinux-release"

      - name: Preserve verified release inputs
        id: release_bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thoxinux-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thoxinux-release/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Issue engineering prerelease
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Thox-ai/thoxinux-azure' && needs.verify.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact verification artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.release_artifact_id }}
          path: ${{ runner.temp }}/thoxinux-release/
          digest-mismatch: error

      - name: Publish or verify immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/create_release.py publish
          --artifact-dir "$RUNNER_TEMP/thoxinux-release"
